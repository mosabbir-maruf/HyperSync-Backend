name = "ws-hypersync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[durable_objects.bindings]]
name = "LOBBY_ROOM"
class_name = "LobbyRoom"

[[durable_objects.bindings]]
name = "GROUP_SIGNALING_ROOM"
class_name = "GroupSignalingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GroupSignalingRoom"]

[vars]
ENVIRONMENT = "production"
