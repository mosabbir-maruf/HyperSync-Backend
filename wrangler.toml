name = "dropsync2-0-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[durable_objects.bindings]]
name = "LOBBY_ROOM"
class_name = "LobbyRoom"

[[durable_objects.bindings]]
name = "GROUP_SIGNALING_ROOM"
class_name = "GroupSignalingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyRoom", "GroupSignalingRoom"]

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = 1
SESSION_TIMEOUT_MS = 900000
HEARTBEAT_INTERVAL_MS = 20000
RECONNECT_WINDOW_MS = 30000
MAX_MESSAGE_SIZE = 16384
SESSION_CODE_LENGTH = 6
